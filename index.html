<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مرتجعات خيام</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>📦 استلام المرتجعات</h1>
  <small id="meta"></small>
</header>

<main>
  <section class="scan">
    <form id="form">
      <input id="tn" inputmode="numeric" autocomplete="off" autofocus placeholder="امسح باركود البوليصة أو اكتب رقم التتبع ثم Enter">
      <button type="submit">بحث</button>
      <button type="button" id="cam" class="alt">📷 كاميرا</button>
    </form>
    <div id="reader" hidden></div>
  </section>

  <div id="status" role="status"></div>
  <div id="result"></div>

  <section id="log-wrap" class="ship" hidden>
    <div class="log-head">
      <h2>سجل الاستلام <small id="log-count"></small></h2>
      <div class="tools">
        <button type="button" id="copy" class="alt">📋 نسخ</button>
        <button type="button" id="xlsx">⬇️ تنزيل Excel</button>
        <button type="button" id="clear" class="alt danger">مسح السجل</button>
      </div>
    </div>
    <div class="table-wrap"><table id="log"></table></div>
  </section>

  <details class="manual">
    <summary>بحث يدوي بالنص (لو البوليصة غير موجودة في Bosta)</summary>
    <select id="m-type">
      <option value="Return to Origin">أوردر مرفوض / استرجاع</option>
      <option value="Exchange">استبدال</option>
    </select>
    <textarea id="m-desc" rows="3" placeholder="وصف الشحنة، مثال: اسدال مشجر اطفالي - اصفر (Y2) / الثالث (QTY 1)"></textarea>
    <textarea id="m-notes" rows="2" placeholder="الملحوظة (للاستبدال)، مثال: تغير المقاس - Ac055DA2 - اسدال رقة اطفالي - بينك (Q2) / الثاني"></textarea>
    <button id="go" type="button">عرض المطلوب استلامه</button>
  </details>
</main>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
